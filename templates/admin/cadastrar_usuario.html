{% extends "base.html" %}

{% block title %}Novo Usuário - TUPBAO{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <h2 class="titulo-secao"><i class="bi bi-person-plus"></i> Novo Usuário</h2>
    <hr class="linha-ambar-left">

    <div class="card shadow">
        <div class="card-body p-4">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-person"></i> Nome</label>
                    <input type="text" name="nome" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-envelope"></i> E-mail</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-key"></i> Senha</label>
                    <input type="password" name="senha" class="form-control" required placeholder="Mínimo 6 caracteres">
                </div>

                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-phone"></i> Celular</label>
                    <input type="text" name="celular" class="form-control" placeholder="(11) 98765-4321" maxlength="20">
                    <small class="text-muted">Opcional. Use um número com DDD.</small>
                </div>

                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-shield"></i> Função</label>
                    <select name="funcao" class="form-select" required>
                        <option value="membro">👤 Membro (visualização)</option>
                        <option value="admin">🔧 Admin (gerencia tudo)</option>
                        <option value="tesouraria">💰 Tesouraria (só financeiro)</option>
                        <option value="limpezas">🧹 Limpezas (só limpezas)</option>
                        <option value="super_admin">⭐ Super Admin (tudo + usuários)</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-people"></i> Grupo de Limpeza</label>
                    <select name="grupo_limpeza" class="form-select">
                        <option value="">Sem grupo definido</option>
                        <option value="1">Equipe 1</option>
                        <option value="2">Equipe 2</option>
                        <option value="3">Equipe 3</option>
                        <option value="4">Equipe 4</option>
                        <option value="5">Equipe 5</option>
                        <option value="6">Equipe 6</option>
                    </select>
                    <small class="text-muted">Opcional. Pode ser definido ou alterado depois.</small>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-ambar"><i class="bi bi-check-lg"></i> Cadastrar</button>
                    <a href="/admin/usuarios" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function formatarCelular(valor) {
    const numeros = valor.replace(/\D/g, '').slice(0, 11);

    if (numeros.length <= 2) {
        return numeros;
    }

    if (numeros.length <= 7) {
        return `(${numeros.slice(0, 2)}) ${numeros.slice(2)}`;
    }

    if (numeros.length <= 10) {
        return `(${numeros.slice(0, 2)}) ${numeros.slice(2, 6)}-${numeros.slice(6)}`;
    }

    return `(${numeros.slice(0, 2)}) ${numeros.slice(2, 7)}-${numeros.slice(7)}`;
}

document.addEventListener('DOMContentLoaded', function () {
    const campoCelular = document.querySelector('input[name="celular"]');

    if (!campoCelular) {
        return;
    }

    campoCelular.value = formatarCelular(campoCelular.value);

    campoCelular.addEventListener('input', function () {
        this.value = formatarCelular(this.value);
    });
});
</script>
{% endblock %}
