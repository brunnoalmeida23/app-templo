{% extends "base.html" %}

{% block title %}Saindo - TUPBAO{% endblock %}

{% block back_button %}{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="text-center py-5">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Saindo...</span>
        </div>

        <p class="mt-3 text-muted">
            Encerrando sua sessão...
        </p>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    const destinoLogout = "{{ url_for('index') }}";

    const fallbackLogout = setTimeout(function () {
        window.location.replace(destinoLogout);
    }, 2500);

    window.OneSignalDeferred = window.OneSignalDeferred || [];

    OneSignalDeferred.push(async function(OneSignal) {
        try {
            await OneSignal.logout();
        } catch (erro) {
            console.warn(
                '[TUPBAO] Não foi possível limpar a identidade OneSignal:',
                erro
            );
        } finally {
            clearTimeout(fallbackLogout);
            window.location.replace(destinoLogout);
        }
    });
</script>
{% endblock %}
